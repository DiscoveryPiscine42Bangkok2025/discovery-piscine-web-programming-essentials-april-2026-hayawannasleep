<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device=width, initial-scale=1.0">
<title>responsive 5-cell table</title>
<style>

  html, body{
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%
    box-sizing: border-box;
    overflow: hidden;
  }

  table{
    width: 100vw;
    height 100vh;
    border-collape: collapse;

    table-layout: fixed;
  }

  td{
    border:2px solid #333;
    text-align: center;
    font-family: sans-serif;
    font-size: 1.2rem;
    padding: 10px;

    word-wrap: break-word;
    overflow: hidden;
  }

  .cell-1 { background color: #ffcccc; height: 20%; }
  .cell-2 { background color: #ccffcc; width: 25%; }
  .cell-3 { background color: #ccccff; width: 50%; }
  .cell-4 { background color: #ffffcc; width: 25%; }
  .cell-5 { background color: #ffccff; height: 20% }

</style>
</head>
<body>

  <table>
    <tr>
      <td colspan="3" class="cell-1">cell 1 (Header)</td>
    </tr>
    <tr>
      <td colspan="3" class="cell-5">Cell 5 (Footer)</td>
    </tr>
  </table>
  
</body>
</html>
