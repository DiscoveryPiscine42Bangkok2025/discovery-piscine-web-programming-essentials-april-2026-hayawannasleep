<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Task Management</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        button{
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        #ft_list{
            border: 2px solid #ccc;
            padding: 10px;
            min-height: 50px;
            width: 300px;
        }
        .todo-item{
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            padding: 10px;
            margin-bottom: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .todo-item:hover{
            background-color: #ffe6e6;
        }
        </style>
        </head>
        <body>
            <button id="new-btn">new</button>
            <div id="ft_list"></div>
            <script>
                window.onload=function(){
                    loadFromCookie();
                };
                document.getElementById('new-btn').addEventListener('click', function() {
                let todoText = prompt("Enter a new TO DO:");
                if (todoText !== null && todoText.trim() !== "") {
                addTodo(todoText);
                saveToCookie();
                }
            });
            function addTodo(text) {
                let list = document.getElementById('ft_list');
                let newTodo = document.createElement('div');
                newTodo.textContent = text;
                newTodo.className = 'todo-item';

                newTodo.onclick = function(){
                    if(confirm("do you really want to remove this TO DO?")) {
                       this.remove();
                       saveToCookie();
                    }
                };
            list.insertBefore(newTodo, list.firstChild);
                    }
            function saveToCookie(){
            let list = document.getElementById('ft_list');
            let todos = [];
            for (let i = 0; i < list.children.length; i++) {
                todos.push(list.children[i].textContent);
            }
            let date = new Date();
            date.setTime(date.getTime()+ (24*60*60*1000));
            document.cookie= "todos="+ encodeURIComponent(JSON.stringify(todos)) + ";expires=" + date.toUTCString() + ";path=/";
        }
        function loadFromCookie() {
            let name = "todos=";
            let decodedCookie = decodeURIComponent(document.cookie);
            let cookieArray = decodedCookie.split(';');
            let storedTodos = null;
            for(let i = 0; i < cookieArray.length; i++) {
                let c = cookieArray[i].trim();
                if (c.indexOf(name) === 0) {
                let jsonString = c.substring(name.length, c.length);
                try {
                    storedTodos = JSON.parse(jsonString);
                    } catch (e) {
                        console.error("Error parsing cookie");
                    }
                    break;
                }
            }
            if (storedTodos && storedTodos.length > 0) {
                for (let i = storedTodos.length - 1; i >= 0; i--) {
                    addTodo(storedTodos[i]);
                }
            }
        }
        </script>
    </body>
    </html>
